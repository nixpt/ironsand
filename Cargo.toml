[workspace]
resolver = "2"
# ironsand: slimmed to the Rust->PTX codegen + host stack needed for zorro
# inference experiments. Upstream's OptiX (ray tracing), cuDNN, and the
# non-inference examples were dropped on fork (see ATTRIBUTION.md).
members = [
  "crates/blastoff",
  "crates/cuda_builder",
  "crates/cuda_std",
  "crates/cuda_std_macros",
  "crates/cust",
  "crates/cust_core",
  "crates/cust_derive",
  "crates/cust_raw",
  "crates/gpu_rand",
  "crates/haiku_san",
  "crates/nvvm",
  "crates/ptx",
  "crates/ptx_compiler",
  "crates/rustc_codegen_nvvm",
  "crates/rustc_codegen_nvvm_macros",

  "examples/gemm",
  "examples/gemm/kernels",
  "examples/gemv",
  "examples/gemv/kernels",
  "examples/attn",
  "examples/attn/kernels",
  "examples/vecadd",
  "examples/vecadd/kernels",

  # async_api: trivial kernel, but a reference for the host-side async stream +
  # event overlap pattern (relevant to inference pipelining: overlapping KV/host
  # copies with decode, multi-stream batching).
  "samples/introduction/async_api",
  "samples/introduction/async_api/kernels",
  "samples/introduction/matmul",
  "samples/introduction/matmul/kernels",

  "tests/compiletests",
  "tests/compiletests/deps-helper",

  "xtask",
]

[profile.dev.package.rustc_codegen_nvvm]
opt-level = 3

[workspace.dependencies]
cuda_std = { path = "crates/cuda_std" }
cuda_builder = { path = "crates/cuda_builder", version = "=0.3.0", default-features = false }
rustc_codegen_nvvm = { path = "crates/rustc_codegen_nvvm", version = "=0.3.0" }
